services:
  agent-anchor:
    build:
      context: .
      dockerfile: Dockerfile
    image: agent-anchor
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MOSS_FAIL_MODE: ${MOSS_FAIL_MODE:-closed}
      MOSS_THRESHOLD: ${MOSS_THRESHOLD:-0.6}
      MOSS_PROJECT_ID: ${MOSS_PROJECT_ID:-}
      MOSS_PROJECT_KEY: ${MOSS_PROJECT_KEY:-}
    restart: unless-stopped
